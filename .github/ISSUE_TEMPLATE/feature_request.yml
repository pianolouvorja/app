name: Feature request
description: Proponha melhoria ou funcionalidade
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema / necessidade
      description: Que fluxo atual precisa melhorar?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposta
      description: Como deve funcionar?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Critérios de aceite
      placeholder: |
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
  - type: textarea
    id: evidence
    attributes:
      label: Referências / mockups / evidências
