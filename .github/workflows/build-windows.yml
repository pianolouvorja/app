# Build Windows NSIS — gera instalador .exe x64 + ia32
# Roda manualmente (workflow_dispatch) ou em push de tags v*
name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows NSIS x64+ia32
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vite + Electron NSIS (x64 + ia32) + publish
        run: npm run electron:build -- --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload x64 installer (artifact backup)
        uses: actions/upload-artifact@v4
        with:
          name: LouvorJA-PIANO-Windows-x64-Setup
          path: dist-electron/*x64*Setup*.exe
          if-no-files-found: warn
          retention-days: 30

      - name: Upload ia32 installer (artifact backup)
        uses: actions/upload-artifact@v4
        with:
          name: LouvorJA-PIANO-Windows-ia32-Setup
          path: dist-electron/*ia32*Setup*.exe
          if-no-files-found: warn
          retention-days: 30
