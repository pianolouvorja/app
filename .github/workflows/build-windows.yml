# Build Windows NSIS — gera instalador .exe x64
# (Electron 44+ não publica mais win32-ia32 — ver docs/DEPLOY.md)
# Roda manualmente (workflow_dispatch) ou em push de tags v*
name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows NSIS x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vite + Electron NSIS (x64) + publish
        run: npm run electron:build -- --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SHA256SUMS and upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd dist-electron
          find . -maxdepth 1 -type f -name '*.exe' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS-win-x64
          cat SHA256SUMS-win-x64
          if [ -n "$TAG" ]; then
            gh release upload "$TAG" SHA256SUMS-win-x64 --clobber
          fi

      - name: Upload x64 installer (artifact backup)
        uses: actions/upload-artifact@v4
        with:
          name: LouvorJA-PIANO-Windows-x64-Setup
          path: |
            dist-electron/*Setup*.exe
            dist-electron/*.exe
            dist-electron/SHA256SUMS-win-x64
          if-no-files-found: warn
          retention-days: 30
