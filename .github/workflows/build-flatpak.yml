name: Build Flatpak

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão da release (ex: 1.22.1)'
        required: true

permissions:
  contents: write

jobs:
  flatpak:
    runs-on: ubuntu-24.04
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-46
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      # Atualiza URL e sha256 do tar.gz para a versão da tag atual.
      # O container Flatpak não traz `gh`; usa curl + sha256sum.
      # Aguarda o Release Linux publicar o tarball (corrida com workflow na mesma tag).
      - name: Update manifest version + sha256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          [ -z "$VERSION" ] && VERSION="${{ github.event.inputs.version }}"
          [ -z "$VERSION" ] && { echo "no version"; exit 1; }
          ASSET="LouvorJA-PIANO-${VERSION}-x64.tar.gz"
          URL="https://github.com/pianolouvorja/app/releases/download/v${VERSION}/${ASSET}"
          SHA=""
          for attempt in $(seq 1 45); do
            if curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -o /tmp/src.tar.gz "$URL"; then
              SHA="$(sha256sum /tmp/src.tar.gz | awk '{print $1}')"
              break
            fi
            echo "Aguardando ${ASSET} na release v${VERSION} (tentativa ${attempt}/45)..."
            sleep 60
          done
          [ -n "$SHA" ] || { echo "Asset não encontrado: ${URL}"; exit 1; }
          echo "version=$VERSION sha256=$SHA"
          MANIFEST=packaging/flatpak/com.pianolouvorja.piano.yaml
          sed -i "s|url: .*/releases/download/.*|url: https://github.com/pianolouvorja/app/releases/download/v$VERSION/${ASSET}|" "$MANIFEST"
          sed -i "s|sha256: [a-f0-9]\{64\}|sha256: $SHA|" "$MANIFEST"
          grep -E 'url:|sha256:' "$MANIFEST"

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: louvorja-piano.flatpak
          manifest-path: packaging/flatpak/com.pianolouvorja.piano.yaml
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          RELEASE_ID="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/pianolouvorja/app/releases/tags/v${VERSION}" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Content-Type: application/octet-stream" \
            "https://uploads.github.com/repos/pianolouvorja/app/releases/${RELEASE_ID}/assets?name=louvorja-piano.flatpak" \
            --data-binary @louvorja-piano.flatpak \
            || echo "upload skipped (run manually or via workflow_dispatch)"
