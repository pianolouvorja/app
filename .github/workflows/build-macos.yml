# Build macOS DMG — gera instalador .dmg x64 + arm64 + latest-mac.yml
# Roda manualmente (workflow_dispatch) ou em push de tags v*
name: Build macOS

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS DMG x64+arm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vite + Electron DMG (x64 + arm64) + publish
        run: npm run electron:build -- --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload x64 DMG (artifact backup)
        uses: actions/upload-artifact@v4
        with:
          name: LouvorJA-PIANO-macOS-x64-DMG
          path: dist-electron/*x64*.dmg
          if-no-files-found: warn
          retention-days: 30

      - name: Upload arm64 DMG (artifact backup)
        uses: actions/upload-artifact@v4
        with:
          name: LouvorJA-PIANO-macOS-arm64-DMG
          path: dist-electron/*arm64*.dmg
          if-no-files-found: warn
          retention-days: 30
