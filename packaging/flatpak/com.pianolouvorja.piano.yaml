app-id: com.pianolouvorja.piano
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: louvorja-piano
rename-icon: louvorja-piano
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=pulseaudio
  - --device=dri
  - --share=network
  - --filesystem=home:ro
  - --filesystem=/var/lib/LouvorJA-PIANO:create
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
modules:
  - name: louvorja-piano
    buildsystem: simple
    build-commands:
      - install -dm755 ${FLATPAK_DEST}/opt/louvorja-piano
      - cp -a * ${FLATPAK_DEST}/opt/louvorja-piano/
      - install -Dm755 louvorja-piano.sh ${FLATPAK_DEST}/bin/louvorja-piano
      # ícone 512x512 vem dentro do tar.gz (resources/icon.png); os demais tamanhos são derivados
      - install -Dm644 resources/icon.png ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/louvorja-piano.png
      - for s in 16 24 32 48 64 128 256; do
          install -Dm644 resources/icon.png ${FLATPAK_DEST}/share/icons/hicolor/${s}x${s}/apps/louvorja-piano.png;
        done
      - install -Dm644 com.pianolouvorja.piano.desktop ${FLATPAK_DEST}/share/applications/com.pianolouvorja.piano.desktop
      - install -Dm644 com.pianolouvorja.piano.metainfo.xml ${FLATPAK_DEST}/share/metainfo/com.pianolouvorja.piano.metainfo.xml
    sources:
      - type: archive
        url: https://github.com/pianolouvorja/app/releases/download/v1.22.1/LouvorJA-PIANO-1.22.1-x64.tar.gz
        sha256: 5ef0b456b697bb801d4c5bb7ed088391e621c74c40ce50f57c702e6a94ed9f89
        # sha256 obtido de: gh release view v1.22.1 -R pianolouvorja/app --json assets
      - type: file
        path: com.pianolouvorja.piano.desktop
      - type: file
        path: com.pianolouvorja.piano.metainfo.xml
      - type: file
        path: louvorja-piano.sh
